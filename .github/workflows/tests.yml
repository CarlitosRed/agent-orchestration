name: tests
# Runs every offline suite under tools/. A ResourceWarning on stderr fails the job:
# `python -W error::ResourceWarning` alone does not, because the warning is raised while an
# object is being finalised, where Python prints it and carries on with exit code 0.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch the scanner from the base commit
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .trusted

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Secret and forbidden-file scan (every commit of the change)
        # Runs FIRST, before any code from the change executes (the suites and the hygiene script are part of
        # the change and could overwrite the scanner). A pull request is scanned by the BASE commit's scanner
        # and config, so it cannot weaken the scan it is judged by; a push to main is scanned by its own tree
        # (it already passed the gate as a pull request). The range covers every commit, so a secret added and
        # removed again inside one PR is still found. Editing this workflow is a protected-path change.
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            gate=.trusted/tools/gate/gate.py; config=.trusted/.orchestration/gate.json
            python -B "$gate" --config "$config" scan --range "$BASE_SHA..$HEAD_SHA"
          elif echo "$BEFORE" | grep -qE '^0+$'; then
            python -B tools/gate/gate.py --config .orchestration/gate.json scan
          else
            python -B tools/gate/gate.py --config .orchestration/gate.json scan --range "$BEFORE..$AFTER"
          fi

      - name: Run every offline suite
        shell: bash
        run: |
          status=0
          count=0
          for dir in tools/*/; do
            ls "$dir"test_*.py >/dev/null 2>&1 || continue
            count=$((count + 1))
            echo "::group::$dir"
            python -B -W default::ResourceWarning -m unittest discover -s "$dir" -p 'test_*.py' 2> "$RUNNER_TEMP/stderr.txt" || status=1
            cat "$RUNNER_TEMP/stderr.txt" >&2
            if grep -q ResourceWarning "$RUNNER_TEMP/stderr.txt"; then
              echo "::error::ResourceWarning in $dir"
              status=1
            fi
            echo "::endgroup::"
          done
          echo "suites run: $count"
          if [ "$count" -eq 0 ]; then
            echo "::error::no test suites found under tools/"
            exit 1
          fi
          exit "$status"

      - name: Repo hygiene checks
        run: python -B tools/hygiene/hygiene.py check

