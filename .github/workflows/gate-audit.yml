name: gate audit
# Detective control, not preventive: after every push to main, check that each new commit carries a
# Gate-Record line (written only by `gate.py merge`). If one does not, open an issue so the Program
# Owner sees a bypass within minutes. The auditor and its config come from the commit BEFORE the push,
# so a push cannot edit the rules it is audited by.
on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip when there is no previous main
        id: before
        run: |
          if echo "${{ github.event.before }}" | grep -qE '^0+$'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No previous commit on main; nothing to audit."
          fi

      - name: Fetch the auditor from the previous main
        if: steps.before.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.before }}
          path: .trusted

      - uses: actions/setup-python@v5
        if: steps.before.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: Audit the new commits
        id: audit
        if: steps.before.outputs.skip != 'true'
        shell: bash
        run: |
          python .trusted/tools/gate/gate.py --config .trusted/.orchestration/gate.json \
            audit --range "${{ github.event.before }}..${{ github.sha }}" 2>&1 | tee audit.txt

      - name: Open an issue when the gate was bypassed
        if: failure() && steps.audit.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --repo "${{ github.repository }}" --title "Gate bypassed on main (${GITHUB_SHA::8})" --body-file audit.txt
